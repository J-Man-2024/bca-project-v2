<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/tasks.css">

    <script type="module" src="../assets/js/pages/tasks.js"></script>

    <title>Task Management System - Tasks</title>
</head>
<body>
    <main>

        <div class="container">

            <div class="tasks-header">

                <h1>
                    Tasks
                </h1>

                <button 
                id="logout-btn" 
                class="btn btn-primary">
                    Logout
                </button>

            </div>

            <div class="controls-section">
                
                <button 
                id="create-task-btn" 
                class="btn btn-primary">
                    Create Task
                </button>

                <div class="filters-section">

                    <select id="status-filter" 
                    class="input">
                        <option value="">
                            All Status
                        </option>

                        <option 
                        value="Pending">
                            Pending
                        </option>

                        <option 
                        value="Completed">
                            Completed
                        </option>
                    </select>

                    <select id="category-filter" 
                    class="input">
                        <option value="">
                            All Categories
                        </option>

                        <option 
                        value="Study">
                            Study
                        </option>

                        <option 
                        value="Personal">
                            Personal
                        </option>

                        <option 
                        value="Work">
                            Work
                        </option>
                    </select>

                    <select id="priority-filter" 
                    class="input">
                        <option value="">
                            All Priorities
                        </option>

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>
                    </select>
                </div>

                <input 
                type="text" 
                id="search-input" 
                class="input"
                placeholder="Search tasks..."
                >

                <select 
                id="sort-filter" 
                class="input"
                >
                    <option value="">
                        Default
                    </option>

                    <option value="createdAt-desc">
                        Newest First
                    </option>

                    <option value="createdAt-asc">
                        Oldest First
                    </option>

                    <option value="title-asc">
                        Title (A-Z)
                    </option>

                    <option value="priority-asc">
                        Priority
                    </option>
                </select>
            
            </div>

            <div class="task-list" id="task-list">
                <!-- Task cards will come here -->
            </div>

            <div class="pagination">
                <button 
                id="prev-page-btn" 
                class="btn btn-primary"
                >
                    Previous
                </button>

                <span id="current-page">
                    Page 1
                </span>

                <button 
                id="next-page-btn" 
                class="btn btn-primary"
                >
                    Next
                </button>
            </div>

        </div>

        <div class="modal hidden" id="task-modal">
            <div class="modal-content">
                <h2 id="modal-title">Create Task</h2>

                <form id="tasks-form">
                    <div class="input-group">
                        <label for="title">
                            Title
                        </label>

                        <input 
                        type="text" 
                        name="title" 
                        id="title" 
                        class="input" 
                        placeholder="Enter task title"
                        >
                    </div>

                    <div class="input-group">
                        <label for="description">
                            Description
                        </label>

                        <textarea 
                        name="description" 
                        id="description" 
                        rows="4" 
                        class="input" 
                        placeholder="Enter task description"
                        >
                        </textarea>
                    </div>

                    <div class="input-group">
                        <label for="category">
                            Category
                        </label>

                        <select name="category" 
                        id="category" 
                        class="input"
                        >
                            <option 
                            value="Study"
                            >
                                Study
                            </option>
                            
                            <option 
                            value="Personal"
                            >
                                Personal
                            </option>
                            <option 
                            value="Work"
                            >
                                Work
                            </option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label 
                        for="priority"
                        >
                            Priority
                        </label>

                        <select 
                        name="priority" 
                        id="priority" 
                        class="input"
                        >
                            <option 
                            value="Low"
                            >
                                Low
                            </option>
                            <option 
                            value="Medium"
                            >
                                Medium
                            </option>
                            <option 
                            value="High"
                            >
                                High
                            </option>
                        </select>
                    </div>

                    <div 
                    class="modal-buttons"
                    >
                        <button 
                        type="submit" 
                        class="btn btn-primary"
                        id="submit-btn"
                        >
                            Create
                        </button>

                        <button 
                        type="button" 
                        class="btn" 
                        id="cancel-btn"
                        >
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>

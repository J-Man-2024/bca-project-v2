<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
	const savedTheme =
		localStorage.getItem("theme");

	if (savedTheme) {
		document.documentElement.setAttribute(
			"data-theme",
			savedTheme
		);
	}
</script>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">

    <script type="module" src="../assets/js/pages/dashboard.js"></script>
    
    <title>Task Management System - Dashboard</title>
</head>
<body>
    <main>

    <div class="container">

        <div id="navbar-container"></div>
        <section class="stats-grid">

            <article class="stat-card">

                <h3>Total Tasks</h3>

                <p id="total-tasks">
                    0
                </p>

            </article>

            <article class="stat-card">

                <h3>Completed Tasks</h3>

                <p id="completed-tasks">
                    0
                </p>

            </article>

            <article class="stat-card">

                <h3>Pending Tasks</h3>

                <p id="pending-tasks">
                    0
                </p>

            </article>

            <article class="stat-card">

                <h3>Completion Percentage</h3>

                <p id="completion-percentage">
                    0%
                </p>

            </article>

        </section>

        <section class="recent-tasks">
            <h2>Recent Tasks</h2>
            <div id="recent-tasks-list">
                
            </div>
        </section>

        <section class="ai-insights">

				<h2>
					🤖 AI Productivity Insights
				</h2>

				<div id="ai-insight">

				</div>

			</section>

    </div>

</main>
</body>
</html>

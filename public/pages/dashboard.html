<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">

    <script type="module" src="../assets/js/pages/dashboard.js"></script>
    
    <title>Task Management System - Dashboard</title>
</head>
<body>
    <main>

    <div class="container">

        <div class="dashboard-header">

            <h1>Dashboard</h1>

            <button
                id="logout-btn"
                class="btn btn-primary"
            >
                Logout
            </button>

        </div>

        <div class="stats-grid">

            <div class="stat-card">

                <h3>Total Tasks</h3>

                <p id="total-tasks">
                    0
                </p>

            </div>

            <div class="stat-card">

                <h3>Completed Tasks</h3>

                <p id="completed-tasks">
                    0
                </p>

            </div>

            <div class="stat-card">

                <h3>Pending Tasks</h3>

                <p id="pending-tasks">
                    0
                </p>

            </div>

            <div class="stat-card">

                <h3>Completion Percentage</h3>

                <p id="completion-percentage">
                    0%
                </p>

            </div>

        </div>

    </div>

</main>
</body>
</html>
